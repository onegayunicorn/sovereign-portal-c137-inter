# =============================================================================
# Sovereign Portal C-137 — hardened nginx server block
#  * Cross-Origin Isolation (COOP/COEP) for WebGPU + SharedArrayBuffer
#  * CSP permitting 'wasm-unsafe-eval' for local WebLLM / Whisper WASM runtimes
#  * gzip incl. application/wasm
#  * /models/ with Accept-Ranges + immutable long-lived cache
#  * SPA fallback to index.html + never-cache sw.js
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Cross-Origin Isolation (WebGPU / SharedArrayBuffer) ----------------
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # --- Baseline security headers -----------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(self)" always;

    # --- Content Security Policy (air-gap safe: no remote origins) ----------
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob: data: ws: wss:; worker-src 'self' blob:; media-src 'self' blob: data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    # --- Compression (incl. WebAssembly model/runtime chunks) --------------
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        application/xml
        application/xml+rss
        image/svg+xml
        model/gltf-binary
        model/gltf+json;

    # --- Large model/weight assets: byte ranges + immutable caching ---------
    location /models/ {
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        proxy_buffering off;
        sendfile on;
        tcp_nopush on;
        types {
            application/wasm           wasm;
            application/octet-stream   bin gguf onnx;
            application/json           json;
        }
        try_files $uri =404;
    }

    # --- Service worker: never cache so updates land immediately -----------
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires 0;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
        types { application/manifest+json webmanifest; }
        try_files $uri =404;
    }

    # --- Hashed static assets: long-lived immutable cache ------------------
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?|ttf|mp4|webm|vrm|glb|gltf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # --- SPA fallback -------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "portal-c137 OK\n";
    }
}
