# ============================================================================
# Sovereign Portal C-137 — hardened nginx configuration
# Cross-origin isolation (COOP/COEP) is required for WebGPU SharedArrayBuffer
# execution of the offline LLM / STT / TTS runtimes.
# ============================================================================

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    # ------------------------------------------------------------- security --
    add_header Cross-Origin-Opener-Policy   "same-origin"   always;
    add_header Cross-Origin-Embedder-Policy "require-corp"  always;
    add_header Cross-Origin-Resource-Policy "same-origin"   always;
    add_header X-Frame-Options              "SAMEORIGIN"    always;
    add_header X-Content-Type-Options       "nosniff"       always;
    add_header Referrer-Policy              "no-referrer"   always;
    add_header Permissions-Policy           "geolocation=(), microphone=(self), camera=(self)" always;
    # wasm-unsafe-eval is mandatory for the WebGPU/WASM inference runtimes.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: data:; font-src 'self' data:; connect-src 'self' blob: data: http://127.0.0.1:8000 http://localhost:8000; worker-src 'self' blob:; child-src 'self' blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'self';" always;

    # ------------------------------------------------------------ compression --
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/wasm
        application/manifest+json
        image/svg+xml
        model/gltf-binary
        model/gltf+json;

    # ----------------------------------------------------- quantized weights --
    # 50MB - 1.5GB ONNX / GGUF / MLC weight caches. Must support byte ranges
    # and must not be transformed or buffered.
    location /models/ {
        expires 365d;
        add_header Cache-Control            "public, no-transform, immutable" always;
        add_header Accept-Ranges            "bytes" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        proxy_buffering  off;
        gzip             off;
        try_files $uri =404;
    }

    # ------------------------------------------------------ shaders & assets --
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|mp4|webm|vrm|glb|gltf|wasm|frag|vert|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # --------------------------------------------------------- service worker --
    # The SW itself must never be cached or updates will never land.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma        "no-cache" always;
        expires 0;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "public, max-age=3600" always;
        types { } default_type application/manifest+json;
        try_files $uri =404;
    }

    # ---------------------------------------------- SOE gateway reverse proxy --
    # Optional: when the orchestrator sidecar is running, expose it same-origin.
    location /health       { proxy_pass http://soe-orchestrator:8000/health;       proxy_set_header Host $host; }
    location /orchestrate/ { proxy_pass http://soe-orchestrator:8000/orchestrate/; proxy_set_header Host $host; }
    location /audit/       { proxy_pass http://soe-orchestrator:8000/audit/;       proxy_set_header Host $host; }
    location /voice/       { proxy_pass http://soe-orchestrator:8000/voice/;       proxy_set_header Host $host; proxy_read_timeout 600s; }

    # ------------------------------------------------------------- SPA routes --
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------------------------------------------------------------- errors --
    error_page 404 /index.html;
    error_page 500 502 503 504 /offline.html;

    location = /offline.html {
        add_header Cache-Control "no-store" always;
    }
}
