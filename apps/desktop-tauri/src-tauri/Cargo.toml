[package]
name = "sovereign-portal-desktop"
version = "1.0.0"
description = "Rick C-137 Sovereign AI Portal PC Desktop Executable"
authors = ["Sovereign AI Labs <admin@sovereign.local>"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-shell = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ring = "0.17"
hex = "0.4"
tokio = { version = "1.37", features = ["full"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
